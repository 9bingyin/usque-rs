[package]
name = "usque-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
boring = "4"
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3"
der = "0.7.10"
env_logger = "0.11.10"
fast-socks5 = "1.0.0"
futures = "0.3.32"
hex = "0.4.3"
hickory-proto = "0.25.2"
log = "0.4.29"
p256 = { version = "0.13.2", features = ["ecdsa"] }
quiche = { version = "0.24.9", features = ["boringssl-boring-crate"] }
quick_cache = "0.6.21"
rand = "0.9.4"
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
ring = "0.17.14"
sec1 = "0.7.3"
serde = { version = "1.0.228", features = ["derive"] }
socket2 = "0.5.10"
serde_json = "1.0.149"
signature = "2.2.0"
smoltcp = { git = "https://github.com/smoltcp-rs/smoltcp.git", rev = "096b006841c57e615f70abf275e1c557ef4d028a", features = ["medium-ip", "proto-ipv4", "proto-ipv4-fragmentation", "proto-ipv6", "socket-tcp", "socket-tcp-cubic", "socket-udp", "assembler-max-segment-count-32", "log"] }
spki = "0.7.3"
thiserror = "2.0.18"
tikv-jemallocator = "0.6.1"
tokio = { version = "1.52.1", features = ["full"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
x509-cert = { version = "0.2.5", features = ["builder"] }
gotatun = { git = "https://github.com/mullvad/gotatun", default-features = false, features = ["ring"] }
configparser = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
