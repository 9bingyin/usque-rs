[package]
name = "usque-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
bytes = "1.11.0"
chrono = "0.4.43"
clap = { version = "4.5.54", features = ["derive"] }
der = "0.7.10"
env_logger = "0.11.8"
fast-socks5 = "1.0.0"
hex = "0.4.3"
hickory-proto = "0.25.2"
log = "0.4.29"
mio = { version = "1.1.1", features = ["net", "os-poll"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
quiche = "0.24.8"
rand_core = { version = "0.9.5", features = ["std", "os_rng"] }
reqwest = { version = "0.13.1", features = ["json", "rustls"] }
ring = "0.17.14"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signature = "2.2.0"
smoltcp = { version = "0.12.0", features = ["medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
spki = "0.7.3"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
url = "2.5.8"
x509-cert = { version = "0.2.5", features = ["builder"] }
